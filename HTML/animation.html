<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .container{
            width: 400px;
            height: 400px;
            background-color: orange;
            /* animation */
            animation: colorChange  5s ease-in 0s 20;
        }

        @keyframes colorChange{
            from{
                background-color: orange;
            }

            to{
                background-color: blue;
            }

        }

        /* Syntax: 
        @keyframe animationName{
         from{
         css property
         }

        }
        
        css selector{
        
        animation: animationName duration timingfunction delay iteration;
        }

        */

        /* for multiple state */
        /* 
        @keyframes animationName{
         0%{
         css property
         }
        
         50%{
         css property
         }

         100%{
         css property
         }
        }
        */


        .box{
            width: 100px;
            height: 100px;
            background-color: red;
            position: relative;
            animation: movebox 10s ease-in-out 0s 10;
        }

        @keyframes movebox{
            0%{
                left: 0;
                top: 0;
                bottom: 0;
                right: 0;
                background-color: red;
            }

            25%{
                left: 200px;
                top: 0;
                bottom: 0;
                right: 0;
                background-color: blue;
            }

            50%{
                left: 200px;
                top: 200px;
                bottom: 0;
                right: 0;
                background-color: orange;
            }

            75%{
                left: 0;
                top: 200px;
                bottom: 0;
                right: 0;
                background-color: yellow;
            }

            100%{
                left: 0;
                top: 0;
                bottom: 0;
                right: 0; 
                background-color: pink;
            }

        }
    </style>
</head>
<body>
    <h1>Animation</h1>

    <div class="container">

    </div>
    <p>Individual Frame</p>
    <div class="box">

    </div>
</body>
</html>

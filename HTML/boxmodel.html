<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box {
            height: 200px;
            width: 400px;
            border: 1px solid black;
            background-color: pink;
        }

        #box2 {
            height: 200px;
            width: 400px;
            border: 1px solid black;
            background-color: pink;
            padding: 50px;
        }

        #box3 {
            height: 200px;
            width: 400px;
            border: 1px solid black;
            background-color: pink;
            padding: 100px 50px;
        }

        #box4 {
            height: 200px;
            width: 400px;
            border: 1px solid black;
            background-color: pink;
            padding: 50px 40px 30px 10px;
        }

        #box5 {
            height: 200px;
            width: 400px;
            border: 1px solid black;
            background-color: pink;
            margin: 50px;
        }

          #box6 {
            height: 200px;
            width: 400px;
            border: 1px solid black;
            background-color: pink;
            margin: 80px 40px;
        }

          #box7 {
            height: 200px;
            width: 400px;
            border: 1px solid black;
            background-color: pink;
            margin: 150px 50px 100px 200px ;
        }
    </style>
</head>
<body>
    <h1>Box Model</h1>

    <p id="box">
        Sudhansu Sunar
    </p>
    <p id="box2">
        Sudhansu Sunar
    </p>
    
    <!-- 
    Padding :
    padding is the space between the element and its bprder.

    syntax:
    padding : allside;
    padding: top bottom left- right;
    padding: top right bottom left;
    -->

    <!-- Top bottom, left right-->
    <p id="box3">Marker </p>

    <!-- Top right, bottom left -->
    <p id="box4"> Bikul Sir Marker </p>

    <h1>Margin</h1>
    <!-- 
    Margin :
    It is the space ouotside the border of the element. Margin set the space between the elements.

    Syntax:
    margin: allside;
    margin: top-bottom left-right;
    margin: top right bottom left;
    -->

    <p id="box5">Flood</p>
    <p id="box6">Landslide</p>
    <p id="box7">Earthquake</p>
</body>
</html>

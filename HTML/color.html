<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Color in HTML</h1>
    <h2>RGB(Red, Grreen, BLue)</h2>
    <hr>
    <p style="background-color: rgb(255,0,0);">Red</p>
    <p style="background-color: rgb(0,255,0);">Green</p>
    <p style="background-color: rgb(0,0,255);">Blue</p>
    <hr>
    <!--
    EGB - in RGB , red , green, and blue are the primary colors.
    The value of each color varies from 0-255.
    -->
    <h2>RGBA</h2>
    <!-- Change the tranparancy of red color-->
    <p style="background-color: rgba(255,0,0,0);">0 Apla</p>
    <p style="background-color: rgba(255,0,0,0.25);">25% Apla</p>
    <p style="background-color: rgba(255,0,0,0.50);">50% Apla</p>
    <p style="background-color: rgba(255,0,0,0.75);">75% Apla</p>
    <p style="background-color: rgba(255,0,0,1);">100% Apla</p>
    <hr>
    <!--In rgba , a stands for alpha. Alpha value varies from 0-1. 
    it displays color transparency level.
    -->

    <h2>HSL(Hue, Saturation, Light)</h2>
    
    <!-- Change background color using hsl-->
    <p style="background-color: hsl(0,50%,50%);">Red</p>
    <p style="background-color: hsl(120,50%,50%);">Green</p>
    <p style="background-color: hsl(240,50%,50%);">Blue</p>
    <p >Saturation</p>
    <p style="background-color: hsl(0,0%,50%);">0% Saturation</p>
    <p style="background-color: hsl(0,100%,50%);">100% Saturation</p>
    <!-- In HSL , 0% light means dark color and 100% light means bright -->
    <p>Light</p>
    <p  style="background-color: hsl(0,0%,100%);">100%</p>
    <p  style="background-color: hsl(0,0%,50%);">50%</p>
    <p  style="background-color: hsl(0,0%,0%);">0%</p>
    <hr>
    <h2>HEX (#RRGGBB)</h2>
    <p style="background-color: #ff0000;">Red</p>
    <p style="background-color: #00ff00;">Green</p>
    <p style="background-color: #0000ff;">Blue</p>
</body>
</html>
